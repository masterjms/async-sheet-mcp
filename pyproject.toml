[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-sheet-mcp"
version = "0.1.0"
description = "MCP server that turns a shared Google Sheet issue list into an async handoff channel for small, remote teams and their AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "masterjms" }]
keywords = ["mcp", "model-context-protocol", "google-sheets", "claude", "async-collaboration"]
dependencies = [
    "mcp>=2.2,<3",
    "gspread>=6.2,<7",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
async-sheet-mcp = "async_sheet_mcp.server:main"

[project.urls]
Repository = "https://github.com/masterjms/async-sheet-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/async_sheet_mcp"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
